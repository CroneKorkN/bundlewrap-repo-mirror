server {
    listen 443      ssl http2;
    listen [::]:443 ssl http2;

    server_name ${server_name};

    ssl_certificate /var/lib/dehydrated/certs/${server_name}/fullchain.pem;
    ssl_certificate_key /var/lib/dehydrated/certs/${server_name}/privkey.pem;

    location / {
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_pass http://127.0.0.1:4001;
    }

% if import_port:
    location = /import {
        # an export is a few hundred kilobytes; the receiver fetches names, avatars and images before it answers
        client_max_body_size 50m;
        proxy_read_timeout 900s;
        proxy_pass http://127.0.0.1:${import_port};
    }

% endif
    location /steamuserimages/ {
        root /var/lib/steam_chat_logger/steamuserimages;
        rewrite ^/steamuserimages(.*)$ $1 break;
        autoindex on;
        # the files have no extension; browsers render png and gif served as jpeg too
        default_type image/jpeg;
    }

    location /avatars/ {
        root /var/lib/steam_chat_logger;
    }
}
