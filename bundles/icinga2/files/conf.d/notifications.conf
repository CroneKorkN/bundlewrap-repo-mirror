// its own address, to filter it apart from other mail to root
object User "icinga" {
  import "generic-user"
  email = "icinga@${node.metadata.get('mail/sender_domain')}"
}

// sent through the local postfix relay, see bundle postfix-relay
apply Notification "mail" to Host {
  import "mail-host-notification"
  users = [ "icinga" ]
  vars.notification_from = "icinga@${node.metadata.get('mail/sender_domain')}"

  assign where true
}

apply Notification "mail" to Service {
  import "mail-service-notification"
  users = [ "icinga" ]
  vars.notification_from = "icinga@${node.metadata.get('mail/sender_domain')}"

  assign where true
}
