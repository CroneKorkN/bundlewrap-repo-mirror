object User "root" {
  import "generic-user"
  email = "${node.metadata.get('mail/root')}"
}

// sent through the local postfix relay, see bundle postfix-relay
apply Notification "mail" to Host {
  import "mail-host-notification"
  users = [ "root" ]

  assign where true
}

apply Notification "mail" to Service {
  import "mail-service-notification"
  users = [ "root" ]

  assign where true
}
